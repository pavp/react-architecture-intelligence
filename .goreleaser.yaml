version: 2
project_name: rai

# Real publishing is enabled only through the gated release workflow. Local and
# manual dry-run validation should keep using `goreleaser release --snapshot --clean --skip=publish`.
snapshot:
  version_template: "{{ .Tag }}-snapshot"

release:
  mode: replace

before:
  hooks:
    - ./scripts/prepare-release.sh

builds:
  - id: rai
    main: ./cmd/rai
    binary: rai
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    # windows/arm64 is excluded: sqlite-vec does not publish a windows-arm64
    # native package (npm 404), so that archive would ship with no natives.
    # Remove this ignore only when sqlite-vec-windows-arm64 is published.
    # darwin/amd64 (Intel Mac) is excluded: not a supported target, and the
    # macos-13 hosted runner needed to build its natives is deprecated/scarce.
    # Re-add it (matrix leg + download step + ignore removal) if Intel Mac
    # support is required.
    ignore:
      - goos: windows
        goarch: arm64
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w
      - -X github.com/pavp/react-architecture-intelligence/internal/launcher.launcherVersion={{ .Version }}
      - -X github.com/pavp/react-architecture-intelligence/internal/launcher.gitCommit={{ .FullCommit }}
      - -X github.com/pavp/react-architecture-intelligence/internal/launcher.buildDate={{ .Date }}

archives:
  - id: portable
    builds: [rai]
    name_template: "rai_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      # metadata.json: written by prepare-release.sh on the single GoReleaser
      # host. Platform field may reflect the build host, but the arch guard in
      # the launcher uses the bundled sqlite-vec-<os>-<arch> directory (below),
      # not the static metadata.json platform field.
      - src: build/release-assets/rai/lib/rai/metadata.json
        dst: lib/rai/metadata.json
      # JS bundle and schema.sql are platform-independent (pure JS).
      - src: build/release-assets/rai/lib/rai/engine/packages/cli/dist/index.js
        dst: lib/rai/engine/packages/cli/dist/index.js
      - src: build/release-assets/rai/lib/rai/engine/packages/cli/dist/schema.sql
        dst: lib/rai/engine/packages/cli/dist/schema.sql
      # Per-arch native node_modules: each matrix CI job builds natives on the
      # actual target platform runner and uploads them as an artifact. The release
      # job downloads each into build/release-assets/<goos>_<goarch>/node_modules/.
      # GoReleaser templates {{ .Os }} and {{ .Arch }} select the correct tree for
      # each of the four platform archives it produces
      # (windows/arm64 and darwin/amd64 ignored).
      - src: "build/release-assets/{{ .Os }}_{{ .Arch }}/node_modules/**"
        dst: lib/rai/engine/node_modules/

checksum:
  name_template: "checksums.txt"

brews:
  - name: rai
    repository:
      owner: "pavp"
      name: "homebrew-tap"
      token: "{{ .Env.RAI_HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/pavp/react-architecture-intelligence"
    description: "React Architecture Intelligence launcher"
    license: "MIT"
    # The launcher resolves its engine at <dir-of-rai>/lib/rai/engine/...
    # so the binary and its lib/ payload MUST stay siblings. The default
    # `bin.install "rai"` copies only the binary and drops lib/, breaking
    # archive-mode resolution. Install the whole archive into libexec
    # (preserving the rai + lib/ layout) and symlink rai into bin.
    install: |
      libexec.install Dir["*"]
      bin.install_symlink libexec/"rai"

scoops:
  - name: rai
    repository:
      owner: "pavp"
      name: "scoop-bucket"
      token: "{{ .Env.RAI_SCOOP_BUCKET_TOKEN }}"
    homepage: "https://github.com/pavp/react-architecture-intelligence"
    description: "React Architecture Intelligence launcher"
    license: "MIT"
