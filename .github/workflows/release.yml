name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Manual vX.Y.Z or vX.Y.Z-rc.N tag to validate"
        required: false
        type: string
      confirm:
        description: "Type RELEASE_PUBLISH_CONFIRM to publish from workflow_dispatch; leave blank for read-only preflight"
        required: false
        type: string

permissions:
  contents: write

jobs:
  # Build per-arch native node_modules on each target platform.
  # GoReleaser cross-compiles the Go launcher on a single host, but native
  # Node extensions (.node files, sqlite-vec extensions) cannot be cross-
  # compiled — they must be built on the exact target platform and arch.
  # Each job runs bundle-engine.mjs for its own platform and uploads the
  # resulting node_modules/ as a named artifact.
  build-native-assets:
    name: Build native assets (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      matrix:
        include:
          - os: macos-14
            goos: darwin
            goarch: arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Bundle native node_modules for ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          node scripts/bundle-engine.mjs \
            --platform ${{ matrix.goos }}/${{ matrix.goarch }} \
            --out build/release-assets/${{ matrix.goos }}_${{ matrix.goarch }}/lib/rai/engine
        shell: bash

      - name: Upload native assets
        uses: actions/upload-artifact@v4
        with:
          name: native-assets-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/release-assets/${{ matrix.goos }}_${{ matrix.goarch }}/lib/rai/engine/node_modules/
          if-no-files-found: error
          retention-days: 1

  # Gated release: runs on a single host, downloads per-arch native assets,
  # places them where GoReleaser expects them, then packages and publishes.
  release:
    name: Gated release
    needs: [build-native-assets]
    runs-on: ubuntu-latest
    env:
      RELEASE_CONFIRMATION: ${{ inputs.confirm || '' }}
      RAI_RELEASE_GITHUB_TOKEN: ${{ secrets.RAI_RELEASE_GITHUB_TOKEN }}
      RAI_HOMEBREW_TAP_TOKEN: ${{ secrets.RAI_HOMEBREW_TAP_TOKEN }}
      RAI_SCOOP_BUCKET_TOKEN: ${{ secrets.RAI_SCOOP_BUCKET_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.RAI_RELEASE_GITHUB_TOKEN }}

    steps:
      - name: Resolve release tag and mode
        id: release
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "RELEASE_PUBLISH=true" >> "$GITHUB_ENV"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            tag="${{ inputs.release_tag }}"
            if [ -z "$tag" ]; then
              echo "workflow_dispatch requires release_tag" >&2
              exit 1
            fi
            echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            if [ "$RELEASE_CONFIRMATION" = "RELEASE_PUBLISH_CONFIRM" ]; then
              echo "RELEASE_PUBLISH=true" >> "$GITHUB_ENV"
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "RELEASE_PUBLISH=false" >> "$GITHUB_ENV"
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Validate release gates
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "release tag must match vX.Y.Z or vX.Y.Z-rc.N" >&2
            exit 1
          fi
          for name in RAI_RELEASE_GITHUB_TOKEN RAI_HOMEBREW_TAP_TOKEN RAI_SCOOP_BUCKET_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "missing required secret $name" >&2
              exit 1
            fi
          done

      - name: Checkout selected tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag points to main history
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git merge-base --is-ancestor HEAD origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release gates
        run: pnpm release:check

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test && pnpm test:launcher

      # Download per-arch native node_modules from the matrix build jobs.
      # Each artifact lands in build/release-assets/<goos>_<goarch>/node_modules/
      # which matches the GoReleaser template {{ .Os }}_{{ .Arch }}.
      - name: Download darwin/arm64 native assets
        uses: actions/download-artifact@v4
        with:
          name: native-assets-darwin-arm64
          path: build/release-assets/darwin_arm64/node_modules/

      - name: Download linux/amd64 native assets
        uses: actions/download-artifact@v4
        with:
          name: native-assets-linux-amd64
          path: build/release-assets/linux_amd64/node_modules/

      - name: Download linux/arm64 native assets
        uses: actions/download-artifact@v4
        with:
          name: native-assets-linux-arm64
          path: build/release-assets/linux_arm64/node_modules/

      - name: Download windows/amd64 native assets
        uses: actions/download-artifact@v4
        with:
          name: native-assets-windows-amd64
          path: build/release-assets/windows_amd64/node_modules/

      # Belt-and-suspenders: assert each downloaded node_modules tree contains
      # at least one sqlite-vec-* directory. download-artifact@v4 is non-fatal
      # on a missing/renamed artifact and goreleaser silently globs an empty dir
      # into the archive. This check fails the job loudly before goreleaser runs.
      - name: Assert native assets present for all platforms
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for platform in darwin_arm64 linux_amd64 linux_arm64 windows_amd64; do
            nm_dir="build/release-assets/${platform}/node_modules"
            if ! compgen -G "${nm_dir}/sqlite-vec-*" > /dev/null 2>&1; then
              echo "ERROR: no sqlite-vec-* dir in ${nm_dir}" >&2
              missing=$((missing + 1))
            else
              echo "OK: ${platform} native assets present"
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "${missing} platform(s) missing native assets — aborting before goreleaser" >&2
            exit 1
          fi

      # Always build the real archives via snapshot first, then smoke-test the
      # packaged artifact + Homebrew install layout. This is a hard gate: a
      # broken package (e.g. missing lib/rai engine payload) fails here and
      # never reaches publish.
      - name: Build release archives (snapshot)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

      - name: Pre-release smoke gate (packaged artifact + Homebrew layout)
        run: ./scripts/smoke-release.sh

      - name: Publish with GoReleaser
        if: steps.release.outputs.publish == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
