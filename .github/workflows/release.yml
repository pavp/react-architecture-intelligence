name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Manual vX.Y.Z or vX.Y.Z-rc.N tag to validate"
        required: false
        type: string
      confirm:
        description: "Type RELEASE_PUBLISH_CONFIRM to publish from workflow_dispatch; leave blank for read-only preflight"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Gated release
    runs-on: ubuntu-latest
    env:
      RELEASE_CONFIRMATION: ${{ inputs.confirm || '' }}
      RAI_RELEASE_GITHUB_TOKEN: ${{ secrets.RAI_RELEASE_GITHUB_TOKEN }}
      RAI_HOMEBREW_TAP_TOKEN: ${{ secrets.RAI_HOMEBREW_TAP_TOKEN }}
      RAI_SCOOP_BUCKET_TOKEN: ${{ secrets.RAI_SCOOP_BUCKET_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.RAI_RELEASE_GITHUB_TOKEN }}

    steps:
      - name: Resolve release tag and mode
        id: release
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "RELEASE_PUBLISH=true" >> "$GITHUB_ENV"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            tag="${{ inputs.release_tag }}"
            if [ -z "$tag" ]; then
              echo "workflow_dispatch requires release_tag" >&2
              exit 1
            fi
            echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            if [ "$RELEASE_CONFIRMATION" = "RELEASE_PUBLISH_CONFIRM" ]; then
              echo "RELEASE_PUBLISH=true" >> "$GITHUB_ENV"
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "RELEASE_PUBLISH=false" >> "$GITHUB_ENV"
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Validate release gates
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "release tag must match vX.Y.Z or vX.Y.Z-rc.N" >&2
            exit 1
          fi
          for name in RAI_RELEASE_GITHUB_TOKEN RAI_HOMEBREW_TAP_TOKEN RAI_SCOOP_BUCKET_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "missing required secret $name" >&2
              exit 1
            fi
          done

      - name: Checkout selected tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag points to main history
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git merge-base --is-ancestor HEAD origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release gates
        run: pnpm release:check

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test && pnpm test:launcher

      # Always build the real archives via snapshot first, then smoke-test the
      # packaged artifact + Homebrew install layout. This is a hard gate: a
      # broken package (e.g. missing lib/rai engine payload) fails here and
      # never reaches publish.
      - name: Build release archives (snapshot)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=publish

      - name: Pre-release smoke gate (packaged artifact + Homebrew layout)
        run: ./scripts/smoke-release.sh

      - name: Publish with GoReleaser
        if: steps.release.outputs.publish == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
