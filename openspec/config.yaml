schema: spec-driven

project: react-architecture-intelligence
persistence:
  mode: hybrid
  artifact_store: both

context: |
  TypeScript ESM/NodeNext pnpm workspace with packages/core, packages/cli, and packages/adapter-next.
  Runtime target is Node >=22; package manager is pnpm.
  Core provides deterministic React architecture analysis, SQLite memory, codemod safety, and MCP tools.
  CLI composes @rai/core with adapters and exposes install, doctor, analyze, mcp, and release checks.
  Go launcher prototype lives under cmd/rai and delegates to the built TypeScript engine.
  Tests use Vitest in node environment across packages/*/src/**/*.test.ts plus Go launcher tests.
  TypeScript strict mode is enabled with noUncheckedIndexedAccess and exactOptionalPropertyTypes.
  CI runs build, tests, typecheck, and lint guards on push/PR.

strict_tdd: true

testing:
  detected: 2026-05-31
  strict_tdd: true
  test_runner:
    framework: Vitest + Go test
    command: pnpm test && pnpm test:launcher
    config: vitest.config.ts
  layers:
    unit:
      available: true
      tool: Vitest, Go testing
      evidence: packages/*/src/**/*.test.ts
    integration:
      available: true
      tool: Vitest with in-memory/temporary SQLite, engine pipeline, MCP session tests, CLI/install/doctor tests, adapter tests
      evidence: packages/core/src/engine/*.test.ts, packages/core/src/mcp/*.test.ts, packages/cli/src/*.test.ts, packages/adapter-next/src/*.test.ts
    e2e:
      available: true
      tool: smoke scripts for compiled CLI and launcher
      evidence: scripts/smoke.sh, scripts/smoke-launcher.sh
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: true
      command: pnpm lint
    type_checker:
      available: true
      command: pnpm typecheck
    formatter:
      available: false
      command: ""
  verified:
    baseline: docs/STATUS.md records pnpm test -> 50 files / 316 tests, pnpm typecheck, pnpm build, pnpm lint, git diff --check
    launcher: docs/STATUS.md records pnpm build:launcher, pnpm test:launcher, scripts/smoke-launcher.sh for P8-S1/P8-S2

rules:
  proposal:
    - Include motivation, impact, rollback notes, and explicit non-goals for risky changes.
    - Keep changes scoped to reviewable units; auto-forecast chained PRs when review workload approaches the active budget.
  specs:
    - Use RFC 2119 keywords for requirements.
    - Use Given/When/Then for scenarios.
    - Preserve RAI integrity model: CODE -> FINDINGS -> CONFIG/MEMORY overlay -> LLM.
  design:
    - Document deterministic boundaries and persistence/write-direction invariants.
    - Keep @rai/core framework-independent; adapters depend on core, never the reverse.
  tasks:
    - Group tasks by phase and keep each task completable in one focused session.
    - Include tests and docs/status updates with the code task when they belong to the same behavior.
  apply:
    tdd: true
    test_command: pnpm test && pnpm test:launcher
    typecheck_command: pnpm typecheck
    review_budget_lines: 800
    rules:
      - Follow existing TypeScript ESM NodeNext imports with explicit .js extensions.
      - Preserve append-only findings/feedback semantics and deterministic pure logic.
  verify:
    test_command: pnpm test && pnpm test:launcher
    build_command: pnpm build
    typecheck_command: pnpm typecheck
    smoke_command: ./scripts/smoke.sh --build
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
    - Keep archived changes as audit trail under openspec/changes/archive/YYYY-MM-DD-{change-name}/.
